# สร้างแอป SMART POS จากโค้ดต้นทางทุกครั้งที่ push แล้วเผยแพร่ GitHub Pages อัตโนมัติ
# ต้องตั้งค่า: Settings → Pages → Build and deployment → Source = "GitHub Actions"
name: สร้างและเผยแพร่แอป

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v5

      - name: ตั้งค่า Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: ติดตั้งไลบรารี
        run: npm install

      - name: ตรวจโครงสร้างและสร้างแอป
        run: npm run build

      - name: ตรวจผลลัพธ์ก่อนเผยแพร่
        run: |
          test -f dist/index.html || { echo "ไม่พบ dist/index.html"; exit 1; }
          test -f dist/sw.js || { echo "ไม่พบ dist/sw.js"; exit 1; }
          if grep -q "__BUILD_ID__" dist/sw.js; then echo "sw.js ยังไม่ได้ใส่เลขเวอร์ชัน"; exit 1; fi
          if grep -q "PRECACHE_START\*/\[\]" dist/sw.js; then echo "sw.js ยังไม่ได้ใส่รายการไฟล์"; exit 1; fi
          echo "ไฟล์ที่เผยแพร่: $(find dist -type f | wc -l)"

      - name: อัปโหลดผลลัพธ์
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: เผยแพร่ไป GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
